name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check app.py analysis scripts tests
      - run: python -m scripts.validate_dataset
      - run: python -m scripts.evaluate_segmentation
      - run: coverage run --source=analysis -m unittest discover -s tests -v
      - run: coverage report --show-missing --fail-under=90

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t starbucks-segmentation:test .
      - run: docker run -d --name dashboard -p 8000:8000 starbucks-segmentation:test
      - name: Verify health endpoint
        run: |
          for attempt in 1 2 3 4 5; do
            curl --fail http://127.0.0.1:8000/api/health && exit 0
            sleep 2
          done
          docker logs dashboard
          exit 1
